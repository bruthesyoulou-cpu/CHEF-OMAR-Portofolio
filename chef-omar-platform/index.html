<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0f">

<style>
[hidden]{display:none!important}
:root,[data-theme=noir]{--bg:#090a0f;--sf:#11141c;--ln:rgba(255,255,255,.13);--tx:#F4F1EA;--mu:#9AA4B8;--gr:#10B981;--gt:#04130d;--am:#F5A524}

body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--bf);overflow-x:hidden}

.w{width:min(1040px,100% - 32px);margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap;padding:8px 0}

nav{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:200px}nav button{flex:none;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:none;color:var(--mu);font:500 .95rem var(--bf);cursor:pointer}

.tab{display:none;padding:44px 0 120px}.tab.on{display:block}
h2{font-size:clamp(1.9rem,5vw,3rem);margin-bottom:10px}.sub{color:var(--mu);max-width:62ch;margin-bottom:28px;white-space:pre-line}
.hero{display:grid;grid-template-columns:.8fr 1.2fr;gap:36px;align-items:center}@media(max-width:780px){.hero{grid-template-columns:1fr}}
.av{aspect-ratio:1;max-width:380px;width:100%;border:1px solid var(--ln);border-radius:24px;background:var(--sf);display:grid;place-items:center;font:800 4.5rem var(--hf);color:var(--gr);overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}

.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}@media(max-width:560px){.two{grid-template-columns:1fr}}

dialog{border:1px solid var(--ln);border-radius:20px;background:var(--sf);color:var(--tx);width:min(560px,100% - 24px);max-height:92svh;overflow:auto;padding:22px}dialog::backdrop{background:rgba(0,0,0,.78)}
dialog>.x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);cursor:pointer}dialog>h3{padding-right:48px;margin-bottom:12px}
.pano{height:min(60svh,420px);border-radius:14px;background-repeat:repeat-x;background-size:auto 100%;cursor:grab;touch-action:pan-y;margin-bottom:12px}
.num{display:flex;justify-content:space-between;gap:10px;padding:12px;margin:8px 0;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.mm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.mm button{min-height:56px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);cursor:pointer;font:600 .9rem var(--bf)}.mm button.on{border-color:var(--am);color:var(--am)}
.tk{border:2px dashed var(--am);border-radius:16px;padding:18px;margin:10px 0;background:var(--bg)}.tk b{display:block;font:800 1.9rem ui-monospace,Consolas,monospace;color:var(--gr);margin:6px 0}
.bb{padding:10px 14px;border-radius:14px;max-width:85%;margin:6px 0;background:var(--bg);border:1px solid var(--ln)}.bb.me{margin-left:auto;border-color:var(--gr)}.bb small{display:block;color:var(--mu);font-size:.75rem}
.cm{border-left:3px solid var(--ln);padding-left:12px;margin:8px 0}
.toast,.cb{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:12;max-width:520px;margin:0 auto;background:var(--sf);border:1px solid var(--am);border-radius:16px;padding:14px}
video{width:100%;border-radius:12px;background:#000}
footer{border-top:1px solid var(--ln);padding:28px 0 110px;color:var(--mu);font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<header><div class="w top"><a class="lg" href="#chef" id="lg"></a><nav id="nav" aria-label="Sections"></nav><button class="ic" id="th" type="button"></button><button class="btn" id="me" type="button">Mon espace</button></div></header>
<div class="w" id="an"></div>

<script src="config.js"></script>
<script>
const CFG=window.CFG||{url:"",key:""};
const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const lk=(t,h,c)=>{const a=el('a',c,t);a.href=h;a.target='_blank';a.rel='noopener';return a};
const btn=(t,c,f)=>{const b=el('button',c,t);b.type='button';b.onclick=f;return b};

const fld=(t,i)=>{const l=el('label',0,t);l.appendChild(i);return l};
const fd=d=>d?new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const DEV=(()=>{let d=ls.get('co_dev');if(!d){d=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);ls.set('co_dev',d)}return d})();
const H={apikey:CFG.key,Authorization:'Bearer '+CFG.key},JH={...H,'Content-Type':'application/json'};

const post=(p,b)=>CFG.url?fetch(CFG.url+'/rest/v1/'+p,{method:'POST',headers:{...JH,Prefer:'return=minimal'},body:JSON.stringify(b)}).then(r=>r.ok).catch(()=>false):Promise.resolve(false);
const rpc=(n,b)=>CFG.url?fetch(CFG.url+'/rest/v1/rpc/'+n,{method:'POST',headers:JH,body:JSON.stringify(b)}).then(r=>r.json().then(j=>({ok:r.ok,j}),()=>({ok:r.ok,j:null}))).catch(()=>({ok:false,j:null})):Promise.resolve({ok:false,j:null});
const DEF={brand:{company:"novakorax corporation",collectif:"Novakorax",tagline:"Haute Gastronomie"},
chef:{name:"Chef Omar",eyebrow:"Haute gastronomie & alchimie africaine",title:"Maître de l'Alchimie Culinaire Sénégalaise",bio:"Haute Gastronomie, Terroirs Ouest-Africains & Botanique Rare. À la croisée des traditions culinaires millénaires d'Afrique de l'Ouest et des techniques contemporaines de la gastronomie moléculaire et du fumage d'art, chaque assiette est un voyage initiatique.",avatar:"",distinction:"Maître Cuisinier 2024",signature:"Fumage Bois d'Acacia",accreditation:"KYC Vérifié A+",dispo:"Disponible pour Dîners Privés",bioFull:""},
socials:{whatsapp:"",phone:"",instagram:"",tiktok:"",youtube:"",email:"",telegram:""},
pay:{wave:"+221 78 184 38 80",orange:"",titulaire:"",cash:"Paiement en espèces auprès du chef ou de son équipe.",endpoint:""},
packages:[],dishes:[],masterclasses:[],
options:{maintenance:false,maintenanceMsg:"Ajustement en cours. Retour très bientôt.",show_reels:true,show_plats:true,show_calendrier:true,show_reserver:true,show_livre:true,show_masterclasses:true,pay_wave:true,pay_orange:true,pay_cash:true,stories_hours:24},
legal:{about:"",terms:"Réservations : toute demande est confirmée par le chef ou son équipe ; une demande n'est pas une confirmation.\nPaiements : par Wave, Orange Money ou espèces. Un paiement mobile n'est valide qu'après vérification du reçu par le chef ; les conditions d'annulation et de remboursement sont convenues avec le chef.\nTickets d'événement : un ticket est personnel et présenté à l'entrée ; une place peut être annulée par l'organisateur en cas de force majeure.\nDonnées personnelles : votre numéro et vos coordonnées restent privés, visibles seulement par le chef et l'administrateur, et servent uniquement à vous répondre.\nAvis et commentaires : ils sont publics, modérés, et ne doivent contenir ni insulte ni information personnelle.\nContenus : les photos, vidéos et recettes appartiennent au Chef Omar et à ses partenaires."}};
const dlg=el('dialog');document.body.appendChild(dlg);
const view=n=>{dlg.innerHTML='';const x=el('button','x','✕');x.type='button';x.setAttribute('aria-label','Fermer');x.onclick=()=>dlg.close();dlg.appendChild(x);n.forEach(e=>dlg.appendChild(e));if(!dlg.open)dlg.showModal()};
dlg.addEventListener('close',()=>{dlg.innerHTML=''});
const toast=(t,a,l)=>{const d=el('div','toast');d.setAttribute('role','status');d.appendChild(el('p',0,t));const r=el('div','row');if(a)r.appendChild(btn(l||'Actualiser','btn g s',()=>{d.remove();a()}));r.appendChild(btn('Fermer','btn s',()=>d.remove()));d.appendChild(r);document.body.appendChild(d);setTimeout(()=>d.remove(),20000)};
const notify=(t,b)=>{try{if('Notification' in window&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}};
const track=(page,extra)=>{if(ls.get('co_consent')==='1')post('visits',{device:DEV,page:String(page).slice(0,100),ref:(document.referrer||'').slice(0,120),ua:navigator.userAgent.slice(0,120),lang:navigator.language,tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||''),...extra})};
const wa=(D,t)=>{const n=(D.socials.whatsapp||'').replace(/\D/g,'');return n?'https://wa.me/'+n+'?text='+encodeURIComponent(t):''};
const sec=(id,title,sub)=>{const s=el('section','tab');s.id=id;if(title)s.appendChild(el('h2',0,title));if(sub)s.appendChild(el('p','sub',sub));$('m').appendChild(s);return s};
const empty=(s,t)=>s.appendChild(el('p','n',t));
const TH=[['noir','●','thème noir accentué'],['nuit','☾','thème bleu de nuit'],['ivoire','☼','thème blanc cassé']];
const theme=n=>{const i=Math.max(0,TH.findIndex(x=>x[0]===n)),t=TH[i],nx=TH[(i+1)%3];document.documentElement.dataset.theme=t[0];ls.set('co_theme',t[0]);$('th').textContent=t[1];const lb='Actuel : '+t[2]+'. Passer au '+nx[2];$('th').title=lb;$('th').setAttribute('aria-label',lb);document.querySelector('meta[name=theme-color]').content={noir:'#090a0f',nuit:'#0D1628',ivoire:'#F7F4ED'}[t[0]]};
theme(document.documentElement.dataset.theme);$('th').onclick=()=>theme(TH[(TH.findIndex(x=>x[0]===document.documentElement.dataset.theme)+1)%3][0]);
const copy=t=>(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>true,()=>{prompt('Copiez :',t);return false});

Promise.all([get('site_content?select=id,data'),get('events?actif=eq.true&order=date.asc'),get('reels?order=created_at.desc&limit=60'),get('announcements?actif=eq.true&order=created_at.desc&limit=3'),get('reviews?visible=eq.true&order=created_at.desc&limit=100'),get('review_comments?order=created_at.asc&limit=400')]).then(([sc,evs,rl,ans,rv,rc])=>{
let X={},META={};sc.forEach(r=>{if(r.id==='meta')META=r.data||{};else X={...X,...r.data}});const D=mrg(DEF,X),C=D.chef,S=D.socials,P=D.pay,O=D.options;
document.title=C.name+' — '+C.title;const ini=C.name.split(' ').map(w=>w[0]).join('').slice(0,2);
$('lg').appendChild(el('i',0,ini));const lt=el('span',0,C.name.toUpperCase());lt.appendChild(el('small',0,D.brand.collectif+' · '+D.brand.tagline));$('lg').appendChild(lt);
$('ft').textContent='© 2026 '+D.brand.company+' . Conçu et construit en public.';
if(!CFG.url)$('m').appendChild(el('p','n','Site non configuré : renseignez config.js.'));
const tabs=[];
if(O.maintenance){const m=sec('maint','Maintenance en cours',O.maintenanceMsg);m.classList.add('on');$('bp').hidden=true;$('nav').hidden=true;$('me').hidden=true;return}
/* ---- Chef ---- */
let s=sec('chef','');tabs.push(['chef','Chef']);const h=el('div','hero'),av=el('div','av',ini);
if(C.avatar){const im=new Image();im.alt=C.name;im.onload=()=>{av.textContent='';av.appendChild(im)};im.src=C.avatar}
h.appendChild(av);const r=el('div');r.appendChild(el('p','ey',C.eyebrow));r.appendChild(el('h1',0,C.name.toUpperCase()));r.appendChild(el('p','tl',C.title));r.appendChild(el('p','sub',C.bio));
const mt=el('div','meta');[['Distinction',C.distinction],['Signature',C.signature],['Accréditation',C.accreditation]].forEach(x=>{if(x[1]){const d=el('div');d.appendChild(el('small',0,x[0]));d.appendChild(el('b',0,x[1]));mt.appendChild(d)}});r.appendChild(mt);
const cr=el('div','row');if(O.show_reserver!==false)cr.appendChild(btn('Demande de réservation','btn g',()=>go('reserver')));if(C.bioFull)cr.appendChild(btn('Voir plus (biographie)','btn',()=>view([el('h3',0,C.name),el('p','sub',C.bioFull)])));r.appendChild(cr);
const so=el('div','row');[['WhatsApp',S.whatsapp&&wa(D,'Bonjour Chef '+C.name)],['Appel',S.phone&&'tel:'+S.phone],['Instagram',S.instagram],['TikTok',S.tiktok],['YouTube',S.youtube],['Email',S.email&&'mailto:'+S.email]].forEach(x=>{if(x[1])so.appendChild(lk(x[0],x[1],'btn'))});r.appendChild(so);
if(C.dispo)r.appendChild(el('p','n',C.dispo));h.appendChild(r);s.appendChild(h);
/* ---- Réels & stories ---- */
const seen=x=>{rpc('bump_view',{p_reel:x.id});track('reel:'+x.id)};
const openReel=x=>{const n=[el('h3',0,x.titre)];if(x.type==='video'){const v=el('video');v.src=x.url;v.controls=true;v.autoplay=true;v.playsInline=true;v.addEventListener('play',()=>seen(x),{once:true});n.push(v)}else{if(x.type==='image'){const i=new Image();i.src=x.url;i.alt=x.titre;i.style.cssText='width:100%;border-radius:12px';n.push(i)}seen(x)}if(x.texte)n.push(el('p','sub',x.texte));view(n)};
s=sec('reels','Menus vidéo, réels & stories','Gestes culinaires et techniques de dressage.');tabs.push(['reels','Réels']);
const lim=(+O.stories_hours||24)*36e5,sts=rl.filter(x=>x.story&&Date.now()-new Date(x.created_at)<lim);
const thumb=x=>{if(x.type==='image'){const i=new Image();i.alt=x.titre;i.loading='lazy';i.src=x.url;return i}if(x.type==='video'){const v=el('video');v.muted=true;v.preload='metadata';v.src=x.url+'#t=0.5';return v}return null};
if(sts.length){const sr=el('div','st');sts.forEach(x=>{const b=btn('','',()=>openReel(x));const t=thumb(x);b.appendChild(t&&x.type==='image'?t:el('span'));b.appendChild(document.createTextNode(x.titre));sr.appendChild(b)});s.appendChild(sr)}
if(rl.length){const g=el('div','g3');rl.forEach(x=>{const c=el('article','c'),t=thumb(x);if(t)c.appendChild(t);c.appendChild(el('h3',0,x.titre));if(x.texte)c.appendChild(el('p',0,x.texte.slice(0,110)));if(x.views)c.appendChild(el('p','n',x.views+' vues'));c.appendChild(btn(x.type==='video'?'▶ Regarder':'Voir','btn g mt',()=>openReel(x)));g.appendChild(c)});s.appendChild(g)}else empty(s,'Aucun réel pour le moment.');
/* ---- Plats VR ---- */
s=sec('plats','Plats en 360°','Faites glisser l\'image pour explorer chaque assiette.');tabs.push(['plats','Plats VR']);
const dish=x=>{const p=el('div','pano');p.style.backgroundImage='url("'+String(x.image).replace(/"/g,'%22')+'")';let px=0,sx=null;p.onpointerdown=e=>{sx=e.clientX-px;p.setPointerCapture(e.pointerId)};p.onpointermove=e=>{if(sx!==null){px=e.clientX-sx;p.style.backgroundPositionX=px+'px'}};p.onpointerup=()=>{sx=null};
const n=[el('h3',0,x.name),p];if(x.tagline)n.push(el('p','sub',x.tagline));[['Cuisson',x.time],['Température',x.temp],['Ingrédients',(x.ingredients||[]).join(', ')],['Notes de dégustation',(x.notes||[]).join(', ')],['Accords',(x.pairings||[]).join(', ')],['Allergènes',(x.allergens||[]).join(', ')]].forEach(a=>{if(a[1]){const d=el('div','num');d.appendChild(el('span',0,a[0]));d.appendChild(el('b',0,a[1]));n.push(d)}});view(n)};
if(D.dishes.length){const g=el('div','g3');D.dishes.forEach(x=>{const c=el('article','c');c.appendChild(el('h3',0,x.name));if(x.native)c.appendChild(el('p','pr',x.native));if(x.category)c.appendChild(el('p',0,x.category));if(x.tagline)c.appendChild(el('p',0,x.tagline));if(x.image)c.appendChild(btn('Visiter en 360°','btn g mt',()=>dish(x)));g.appendChild(c)});s.appendChild(g)}else empty(s,'Les plats seront publiés prochainement.');
/* ---- Calendrier + tickets ---- */
