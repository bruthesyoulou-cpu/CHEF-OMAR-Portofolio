<script>
const CFG=window.CFG||{url:'',key:''};let TOK='',EM='',ROLE='',CH={},AD={},MT={v:1,sections:{}};
const $=i=>document.getElementById(i),mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

 box.appendChild(F);box.appendChild(bt('Enregistrer et publier','p',()=>{const o={};F.querySelectorAll('details[data-g]').forEach(d=>{o[d.dataset.g]=rd(d)});F.querySelectorAll('details[data-l]').forEach(d=>{const a=[];d.querySelectorAll('.it').forEach(it=>{const v=rd(it);if(Object.keys(v).some(k=>v[k]&&!(Array.isArray(v[k])&&!v[k].length)))a.push(v)});o[d.dataset.l]=a});saveRow(row,Object.assign(store,o),label)}))}

function picker(){const w=mk('div'),u=mk('input'),ms=mk('p','n'),pv=mk('div');let cur=null;u.type='file';u.accept='image/*,video/mp4,video/webm';
 u.onchange=()=>{const f=u.files[0];cur=null;pv.innerHTML='';if(!f)return;const isV=/^video\//.test(f.type);ms.textContent='Vérification…';const send=(blob,type)=>{ms.textContent='Envoi…';up('media',blob,(p,e)=>{if(!p){ms.textContent='⚠ Échec de l\'envoi ('+e+')';return}cur={url:pubUrl(p),type};const m=mk(type==='video'?'video':'img');m.src=cur.url;m.controls=true;m.style.maxHeight='260px';pv.appendChild(m);ms.textContent='Média prêt. Cliquez sur Publier.'})};

 w.append(Object.assign(mk('label',0,'Image ou vidéo (30 secondes maximum)'),{}),u,ms,pv);w.firstChild.appendChild(u);return{el:w,get:()=>cur,reset:()=>{cur=null;pv.innerHTML='';u.value='';ms.textContent=''}}}

 if(!RO()){const f=mk('div','card'),F={titre:mk('input'),date:mk('input'),lieu:mk('input'),capacite:mk('input'),note:mk('input'),actif:mk('input')};F.date.type='date';F.capacite.type='number';F.actif.type='checkbox';F.actif.checked=true;
